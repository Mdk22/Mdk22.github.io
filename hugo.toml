baseURL = "https://mdk22.github.io/"
locale = "en-US"
title = "Mdk22 Security Write-Ups"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[taxonomies]
  tag = "tags"
  category = "categories"
  cwe = "cwes"
  pattern = "patterns"
  method = "methods"

[params]
  author = "Mdk22"
  description = "Step-by-step web security write-ups with requests, responses, commands, payloads, impact, and fixes from authorized training labs."
  defaultTheme = "dark"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = true

[params.homeInfoParams]
  Title = "Mdk22 Security Write-Ups"
  Content = "Practical web security write-ups from authorized labs and purpose-built training environments."

[params.assets]
  favicon = "favicon.ico"
  favicon16x16 = "favicon-16x16.png"
  favicon32x32 = "favicon-32x32.png"
  apple_touch_icon = "apple-touch-icon.png"
  safari_pinned_tab = "safari-pinned-tab.svg"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/Mdk22"
[caches]
  [caches.images]
    dir = ':cacheDir/images'
[[menus.main]]
  identifier = "writeups"
  name = "Write-Ups"
  url = "/writeups/"
  weight = 10

[[menus.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 20

[[menus.main]]
  identifier = "disclosure-policy"
  name = "Disclosure Policy"
  url = "/disclosure-policy/"
  weight = 30
